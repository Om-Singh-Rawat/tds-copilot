<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDS Copilot</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1d2330; --muted: #5d6677; --line: #dfe3ea;
    --accent: #2f5bd3; --ok-bg: #e5f5ec; --ok-ink: #17643a; --warn-bg: #fff2d9; --warn-ink: #8a5600;
    --code-bg: #f0f2f6; --human-bg: #e9e9fb; --human-ink: #3b3b9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --card: #1c2028; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2d333e;
      --accent: #7c9dff; --ok-bg: #173826; --ok-ink: #8fe0b0; --warn-bg: #3d2f12; --warn-ink: #ffd27a;
      --code-bg: #242934; --human-bg: #262850; --human-ink: #b9bcff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 16px; padding: 16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select, input, textarea, button { font: inherit; color: var(--ink); }
  select, input, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; min-height: 260px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 8px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .banner { border-radius: 8px; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .banner.auto { background: var(--ok-bg); color: var(--ok-ink); }
  .banner.review { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.human_decided { background: var(--human-bg); color: var(--human-ink); }
  .banner .amt { font-size: 22px; }
  ul.reasons { margin: 10px 0 0; padding-left: 18px; }
  ul.reasons code { font-size: 11px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--code-bg); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .cite { cursor: pointer; text-decoration: underline dotted; margin-right: 6px; font-size: 12px; color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  .steps { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--code-bg); padding: 10px; border-radius: 6px; white-space: pre-wrap; margin: 6px 0; }
  .src { border-left: 3px solid var(--accent); padding: 6px 10px; margin: 8px 0; background: var(--code-bg); border-radius: 0 6px 6px 0; }
  .src.hl { outline: 2px solid var(--accent); }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .scroll { overflow-x: auto; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>TDS Copilot <span class="muted">prototype</span></h1>
  <p>The AI proposes a TDS section with citations. Code computes the amount. A human approves. Synthetic data only, not tax advice.</p>
</header>
<main>
  <section>
    <div class="card">
      <h2>Invoice</h2>
      <label>Sample invoice</label>
      <select id="caseSel"></select>
      <div class="row">
        <div><label>Classifier</label>
          <select id="mode"><option value="llm">AI (LLM + retrieval)</option><option value="baseline">Keyword baseline</option></select></div>
        <div><label>Samples (self-consistency)</label>
          <select id="samples"><option>1</option><option>3</option></select></div>
      </div>
      <label>Invoice JSON (editable)</label>
      <textarea id="invoice" spellcheck="false"></textarea>
      <div class="row" style="margin-top:10px"><button class="primary" id="runBtn">Classify &amp; compute</button></div>
      <p class="muted" id="llmStatus"></p>
    </div>
    <div class="card">
      <h2>Audit trail <button id="auditBtn" style="float:right;padding:2px 8px">refresh</button></h2>
      <div id="audit" class="scroll muted">-</div>
    </div>
  </section>

  <section>
    <div class="card" id="result"><div class="empty">Pick an invoice and press <b>Classify &amp; compute</b>.</div></div>
    <div class="card" id="reviewCard" hidden>
      <h2>Reviewer decision</h2>
      <div id="overrides"></div>
      <div class="row">
        <div><label>Reviewer</label><input id="reviewer" placeholder="your name"></div>
        <div><label>Note</label><input id="note" placeholder="why"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="recalcBtn">Recompute with my sections</button>
        <button class="primary" id="approveBtn">Approve &amp; record</button>
      </div>
      <p class="muted" id="decisionMsg"></p>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let META = null, LAST = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr = n => n == null ? "not computed" : "Rs " + Number(n).toLocaleString("en-IN");

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}

async function init() {
  META = await api("/api/cases");
  $("caseSel").innerHTML = META.cases.map(c => `<option value="${c.id}">${c.id} - ${esc(c.tag)}</option>`).join("");
  $("caseSel").onchange = loadCase;
  $("llmStatus").textContent = META.llm_configured
    ? `LLM: ${META.model} via OpenRouter`
    : "No OPENROUTER_API_KEY set: AI mode will route everything to review. Use the keyword baseline or add a key to .env.";
  loadCase(); refreshAudit();
}
function loadCase() {
  const c = META.cases.find(c => c.id === $("caseSel").value);
  $("invoice").value = JSON.stringify(c.invoice, null, 2);
}

async function run(mode, codes) {
  let invoice;
  try { invoice = JSON.parse($("invoice").value); } catch (e) { alert("Invoice JSON is invalid: " + e.message); return; }
  $("runBtn").disabled = true; $("result").innerHTML = '<div class="empty">Working...</div>';
  try {
    LAST = codes ? await api("/api/override", {invoice, codes})
                 : await api("/api/run", {invoice, mode: $("mode").value, samples: $("samples").value});
    render(LAST);
  } catch (e) { $("result").innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`; }
  $("runBtn").disabled = false; refreshAudit();
}

function render(r) {
  const label = {auto: "AUTO-SUGGEST", review: "NEEDS REVIEW", human_decided: "REVIEWER DECISION"}[r.route];
  const reasons = r.reasons.length
    ? `<ul class="reasons">${r.reasons.map(x => `<li><code>${esc(x.code)}</code> ${esc(x.msg)}</li>`).join("")}</ul>` : "";
  const rows = r.invoice.lines.map((l, i) => {
    const c = r.classifications[i];
    const cites = c.citations.map(id => `<span class="cite" data-id="${esc(id)}">${esc(id)}</span>`).join("") || '<span class="muted">none</span>';
    return `<tr><td>${i + 1}</td><td>${esc(l.description)}<div class="muted">${inr(l.taxable_value)} + GST ${inr(l.gst)}</div></td>
      <td><span class="pill">${esc(c.code)}</span><div class="muted">conf ${esc(c.confidence)}${r.agreement[i] < 1 ? ", agreement " + Math.round(r.agreement[i]*100) + "%" : ""}</div></td>
      <td>${cites}<div class="muted">${esc(c.reasoning)}</div></td>
      <td><span class="pill">${esc(r.baseline_codes[i] ?? "-")}</span></td></tr>`;
  }).join("");
  const steps = r.engine ? r.engine.sections.map(s => `<div class="steps">${s.steps.map(esc).join("\n")}</div>`).join("")
                         : '<p class="muted">Engine not run (no rule set for this date, or non-resident payee).</p>';
  const srcs = r.retrieved.map(s => `<div class="src" id="src-${esc(s.id)}"><b>${esc(s.id)}</b> <span class="muted">${esc(s.authority)} · ${esc(s.source)} · score ${s.score}</span><div>${esc(s.text)}</div></div>`).join("");
  $("result").innerHTML = `
    <div class="banner ${r.route}"><span>${label}</span><span class="amt">TDS ${inr(r.tds_total)}</span></div>
    ${reasons}
    <div class="meta"><span>vendor: ${esc(r.vendor?.name ?? "unknown")} (${esc(r.vendor?.pan ?? "no PAN")})</span>
      <span>mode: ${esc(r.mode)}</span><span>model: ${esc(r.model ?? "-")}</span>
      <span>rules: ${esc(r.rule_set_id ?? "NONE")}</span><span>kb: ${esc(r.kb_version)}</span><span>audit: ${esc(r.audit_id ?? "-")}</span></div>
    <h2 style="margin-top:18px">Classification</h2>
    <div class="scroll"><table><tr><th>#</th><th>Line</th><th>Section</th><th>Sources &amp; reasoning</th><th>Keyword check</th></tr>${rows}</table></div>
    <h2 style="margin-top:18px">Deterministic calculation</h2>${steps}
    ${r.error ? `<p class="muted">Classifier error: ${esc(r.error)}</p>` : ""}
    <details style="margin-top:12px"><summary>Retrieved sources (${r.retrieved.length})</summary>${srcs}</details>`;
  document.querySelectorAll(".cite").forEach(el => el.onclick = () => {
    const d = document.querySelector("details"); d.open = true;
    const t = $("src-" + el.dataset.id);
    document.querySelectorAll(".src").forEach(s => s.classList.remove("hl"));
    if (t) { t.classList.add("hl"); t.scrollIntoView({behavior: "smooth", block: "center"}); }
    else alert(el.dataset.id + " was NOT among the retrieved sources (ungrounded citation)");
  });
  const opts = Object.keys(META.codes);
  $("overrides").innerHTML = r.invoice.lines.map((l, i) => `<label>Line ${i + 1}: ${esc(l.description.slice(0, 60))}</label>
    <select data-line="${i}">${opts.map(o => `<option ${o === r.classifications[i].code ? "selected" : ""}>${o}</option>`).join("")}</select>`).join("");
  $("reviewCard").hidden = false; $("decisionMsg").textContent = "";
}

function chosenCodes() { return [...document.querySelectorAll("#overrides select")].map(s => s.value); }

async function approve() {
  const codes = chosenCodes();
  const changed = codes.some((c, i) => c !== LAST.classifications[i].code);
  if (changed) { await run("human", codes); }
  const res = await api("/api/decision", {audit_id: LAST.audit_id, action: changed ? "override" : "approve",
    codes, tds_total: LAST.tds_total, reviewer: $("reviewer").value, note: $("note").value});
  $("decisionMsg").textContent = `Recorded ${changed ? "override" : "approval"} (record ${res.record_id}).`;
  refreshAudit();
}

async function refreshAudit() {
  const rows = await api("/api/audit");
  $("audit").innerHTML = rows.length ? `<table>${rows.map(r => `<tr><td>${esc(r.ts.slice(11, 19))}</td><td>${esc(r.event)}</td>
    <td>${esc(r.invoice_no ?? r.action ?? "")}</td><td>${esc(r.route ?? (r.final_codes || []).join(","))}</td><td>${esc(r.record_id)}</td></tr>`).join("")}</table>` : "empty";
}

$("runBtn").onclick = () => run();
$("recalcBtn").onclick = () => run("human", chosenCodes());
$("approveBtn").onclick = approve;
$("auditBtn").onclick = refreshAudit;
init();
</script>
</body>
</html>
